name: Acceptance test (Lyo HEAD)
run-name: "acceptance@${{ github.ref_name }} (Lyo@${{ inputs.lyoBranch }}; comment: ${{ inputs.comment }})"

on:
  workflow_dispatch:
    inputs:
      lyoBranch:
        description: Lyo branch to test on
        required: true
        default: main
      lyoRepo:
        description: Lyo repository or fork
        required: true
        default: eclipse-lyo/lyo
      comment:
        description: Comment, e.g. PR number
        default: n/a

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.lyoRepo }}-${{ inputs.lyoBranch }}
  cancel-in-progress: false

jobs:
  build:
    name: Build against Lyo HEAD
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.lyoRepo }}
          ref: ${{ inputs.lyoBranch }}
          path: lyo-trunk
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: main
          persist-credentials: false
      - name: Set up JDK 25 (Jetty image fallback)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Maven build (Lyo)
        run: >-
          mvn -B --no-transfer-progress
          clean install --file lyo-trunk/pom.xml
          -P '!spotbugs,!spotless,!enforcer'
          -Dmaven.test.skip=true -Dmaven.javadoc.skip=true
          -Dmaven.source.skip=true -Dcyclonedx.skip=true
      - name: Detect checked-out Lyo version
        id: lyo-version
        shell: bash
        run: |
          mvn -B --no-transfer-progress --non-recursive --file lyo-trunk/pom.xml \
            org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate \
            -Dexpression=project.version -Doutput="$RUNNER_TEMP/lyo-version.txt"
          lyo_version="$(cat "$RUNNER_TEMP/lyo-version.txt")"
          if [[ ! "$lyo_version" =~ ^[0-9][A-Za-z0-9._-]*$ ]]; then
            echo "Invalid Lyo version: $lyo_version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$lyo_version" >> "$GITHUB_OUTPUT"
      - name: Maven build (project)
        env:
          LYO_VERSION: ${{ steps.lyo-version.outputs.version }}
        run: mvn -B --no-transfer-progress clean verify --file main/source/BugzillaLyoArchives/pom.xml "-Dversion.lyo=$LYO_VERSION"
