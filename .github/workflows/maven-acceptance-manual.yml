name: Acceptance test (Lyo HEAD)
run-name: "acceptance@${{ github.ref_name }} (Lyo@${{ inputs.lyoBranch }}; comment: ${{ inputs.comment }})"

on:
  workflow_dispatch:
    inputs:
      lyoBranch:
        description: Lyo branch to test on
        required: true
        default: main
      lyoRepo:
        description: Lyo repository or fork
        required: true
        default: eclipse-lyo/lyo
      comment:
        description: Comment, e.g. PR number
        default: n/a

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.lyoRepo }}-${{ inputs.lyoBranch }}
  cancel-in-progress: false

jobs:
  build:
    name: Build against Lyo HEAD
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ inputs.lyoRepo }}
          ref: ${{ inputs.lyoBranch }}
          path: lyo-trunk
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: main
          persist-credentials: false
      - name: Set up JDK 25 (Jetty image fallback)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Maven build (Lyo)
        run: mvn -B --no-transfer-progress clean install --file lyo-trunk/pom.xml -DskipTests -Dmaven.javadoc.skip=true
      - name: Maven build (project)
        run: mvn -B --no-transfer-progress clean verify --file main/source/BugzillaLyoArchives/pom.xml
